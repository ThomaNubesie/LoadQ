<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 29" fill="none"
     width="140" height="58" role="img" aria-label="LoadQ shuttle">
  <title>LoadQ shuttle</title>
  <!--
    The LoadQ shuttle. Canonical copy — components/VanIcon.tsx is the React Native port of this
    path data; change one, change both.

    Orange is #FF8A1A (accentWarm), identical in the light and azure themes. Strokes only, no
    fills: the wheel arches are cut out of the body outline rather than masked with a
    background-coloured disc, so the icon stays transparent on any background.

    Nose points right by default — route strips run origin-left to destination-right. To face the
    other way add transform="scale(-1,1)" translate(-70,0) to the <g>, or scaleX(-1) in CSS.
  -->
  <g stroke="#FF8A1A">
    <!-- body; the two arcs near the bottom are the wheel arches -->
    <path d="M3.4 20.6V10.6a3.2 3.2 0 0 1 3.2-3.2h28.9c.9 0 1.8.4 2.4 1.1l5.2 5.9h6.6
             a7.3 7.3 0 0 1 7.3 7.3v.6a1.4 1.4 0 0 1-1.4 1.4h-4.5a4.6 4.6 0 0 0-9.2 0H21.1
             a4.6 4.6 0 0 0-9.2 0H4.8a1.4 1.4 0 0 1-1.4-1.4z"
          stroke-width="2.3" stroke-linejoin="round"/>
    <!-- window pillars and the windscreen rake -->
    <path d="M10.5 8.2v6.2M19.6 8.2v6.2M28.7 8.2v6.2M36.4 9.4l4.1 4.6"
          stroke-width="1.7" stroke-linecap="round" opacity=".5"/>
    <path d="M3.4 14.4h39.7" stroke-width="1.7" opacity=".5"/>
    <circle cx="16.5" cy="23.6" r="4.3" stroke-width="2.3"/>
    <circle cx="45.9" cy="23.6" r="4.3" stroke-width="2.3"/>
  </g>
</svg>
