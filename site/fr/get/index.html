<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obtenir LoadQ — Télécharger l'application</title>
  <meta name="description" content="Téléchargez LoadQ — trajets interurbains partagés et vérifiés partout au Canada." />
  <link rel="alternate" hreflang="en" href="/get" />
  <link rel="alternate" hreflang="fr" href="/fr/get" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .get-wrap { max-width: 560px; margin: 0 auto; padding: 64px 24px; text-align: center; }
    .get-wrap h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
    .get-wrap p.lead { font-size: 18px; color: #AEB6C4; margin-bottom: 36px; }
    .store-row { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
    .store-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 18px 24px; border-radius: 14px; border: 1px solid #3E4453;
      background: #232733; color: #FFFFFF; font-size: 17px; font-weight: 700;
      text-decoration: none; transition: background 0.15s;
    }
    .store-btn:hover { background: #2C313F; }
    .store-btn.primary { background: #4C82F0; color: #fff; border-color: #4C82F0; }
    .store-btn.primary:hover { background: #3B6FD4; }
    .store-btn .sub { font-size: 13px; font-weight: 500; opacity: 0.7; margin-left: 6px; }
    .platform-detected { font-size: 13px; color: #7C8697; margin-top: 28px; }
    .lang-switch { position: absolute; top: 20px; right: 20px; }
    .lang-switch a { color: #4C82F0; text-decoration: none; font-size: 14px; font-weight: 600; margin-left: 8px; }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#15171C" />
</head>
<body>
  <div class="lang-switch">
    <a href="/get">EN</a> · <a href="/fr/get" class="active">FR</a>
  </div>
  <main class="get-wrap">
    <h1 style="color:#FF8A1A;">LoadQ</h1>
    <p class="lead">Trajets interurbains partagés au Canada.</p>

    <div id="primary-cta" class="store-row" style="margin-bottom: 24px;"></div>

    <details style="text-align:left; margin-top: 28px;">
      <summary style="cursor:pointer; color:#888; font-size:14px;">Autres options de téléchargement</summary>
      <div class="store-row" style="margin-top: 16px;">
        <a class="store-btn" href="https://apps.apple.com/ca/app/id6770652996">
          iOS — App Store <span class="sub">(public)</span>
        </a>
        <a class="store-btn" href="https://testflight.apple.com/join/dvFFngSP">
          iOS — TestFlight <span class="sub">(testeurs bêta)</span>
        </a>
        <a class="store-btn" href="https://play.google.com/store/apps/details?id=ca.loadq.app">
          Android — Test interne <span class="sub">(testeurs invités)</span>
        </a>
      </div>
    </details>

    <p class="platform-detected" id="detected"></p>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var cta = document.getElementById("primary-cta");
      var detected = document.getElementById("detected");

      function btn(href, label, sub, primary) {
        return '<a class="store-btn' + (primary ? ' primary' : '') + '" href="' + href + '">' +
               label + (sub ? ' <span class="sub">' + sub + '</span>' : '') + '</a>';
      }

      if (isIOS) {
        cta.innerHTML = btn("https://apps.apple.com/ca/app/id6770652996", "Télécharger pour iPhone", "App Store", true);
        detected.textContent = "Appareil détecté : iPhone / iPad";
      } else if (isAndroid) {
        cta.innerHTML =
          btn("https://play.google.com/store/apps/details?id=ca.loadq.app", "Rejoindre la bêta Android", "Test interne Play", true) +
          '<div style="font-size:13px;color:#888;margin-top:4px;">Sortie publique sur Google Play bientôt.</div>';
        detected.textContent = "Appareil détecté : Android";
      } else {
        cta.innerHTML =
          btn("https://apps.apple.com/ca/app/id6770652996", "App Store iOS", "iPhone / iPad", true) +
          btn("https://play.google.com/store/apps/details?id=ca.loadq.app", "Bêta Android", "Test interne Play", false);
        detected.textContent = "Ouvrez cette page sur votre téléphone pour une installation en un clic.";
      }
    })();
  </script>
</body>
</html>
